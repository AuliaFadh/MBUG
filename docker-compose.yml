version: '3.8'

services:
  web:
    build: .
    container_name: mbug-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: mbug-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mbug
    volumes:
      - db_data:/var/lib/mysql
      # Automatically imports mbug.sql when the container database is created
      - ./mbug.sql:/docker-entrypoint-initdb.d/mbug.sql:ro

volumes:
  db_data:
