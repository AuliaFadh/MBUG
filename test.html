<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       .fade-toast {
    opacity: 0;
    transform: translateY(-20px); /* Toast sedikit naik ke atas sebelum muncul */
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
}

.show-toast {
    opacity: 1;
    transform: translateY(0);
}

/* ✅ Animasi Fade-out saat ditutup */
.hide-toast {
    opacity: 0 !important;
    transform: translateY(-20px) !important;
    transition: opacity 0.5s ease-in, transform 0.5s ease-in;
}
        </style>


</head>

<body>

  
    <div class="toast-container toast-custom position-fixed top-0 end-0 p-3">
      
            <div class="toast align-items-center text-white bg-success-emphasis border-0 fade-toast" 
                 role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
                <div class="d-flex">
                    <div class="toast-body">
             Test
                    </div>
                    <button type="button" class="toast-btn-close-custom mx-2" data-bs-dismiss="toast">

X                    </button>
                </div>
            </div>
 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {
        var toastEls = document.querySelectorAll('.fade-toast');
        toastEls.forEach(function(toastEl) {
            toastEl.classList.add('show-toast'); // ✅ Fade In
            var toast = new bootstrap.Toast(toastEl);
            toast.show();

            // ✅ Fade Out saat toast mulai ditutup
            toastEl.addEventListener('hidden.bs.toast', function() {
                toastEl.classList.remove('show-toast'); // Hilangkan class untuk animasi smooth
                toastEl.classList.add('hide-toast'); // Tambahkan animasi fade-out
                setTimeout(() => toastEl.remove(), 500); // Hapus elemen setelah animasi selesai
            });
        });
    }, 500); // ✅ Delay sebelum muncul (500ms)
});
        </script>
        
</body>

</html>
